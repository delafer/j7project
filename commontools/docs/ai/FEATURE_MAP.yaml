features:
  - id: archive_browsing
    title: Archive Browsing
    summary: Opens supported archives as virtual image containers and exposes image entries through the same navigation model used for directories.
    status: confirmed
    owning_module: xanderView
    packages:
      - org.delafer.xanderView.file
      - org.delafer.xanderView.file.readers
      - org.delafer.xanderView.file.entry
      - net.sf.sevenzipjbinding
    classes:
      - org.delafer.xanderView.file.CommonContainer
      - org.delafer.xanderView.file.readers.ArcTypes
      - org.delafer.xanderView.file.readers.SevenZipReader
      - org.delafer.xanderView.file.entry.ImageZip
      - net.sf.sevenzipjbinding.SevenZip
    entry_points:
      - org.delafer.xanderView.file.CommonContainer.getReader
      - org.delafer.xanderView.file.readers.SevenZipReader.read
      - org.delafer.xanderView.file.readers.SevenZipReader.getEntryByIdentifier
    ui_surfaces:
      - org.delafer.xanderView.gui.MainWindow.createFileMenu
      - org.delafer.xanderView.gui.MainWindow.bindKeyEvent
    collaborators:
      - org.delafer.xanderView.file.entry.ImageAbstract
      - org.delafer.xanderView.comparator.ComparatorFactory
      - net.sf.sevenzipjbinding.impl.RandomAccessNioStream
    configs: []
    resources: []
    native_dependencies:
      - lib7-Zip-JBinding
      - libgcc_s_seh-1
    persistence:
      - _zlst.csv
    tests:
      - xanderView/src/test/java/org/delafer/xanderView/common/ArcFormats.java
    related_features:
      - recursive_scan_and_live_watch
      - image_decode_pipeline
      - native_codec_and_library_loading
    evidence:
      - path: xanderView/src/main/java/org/delafer/xanderView/file/CommonContainer.java
        symbols:
          - org.delafer.xanderView.file.CommonContainer.getReader
        note: Selects SevenZipReader when the opened path is a file whose extension matches ArcTypes.
      - path: xanderView/src/main/java/org/delafer/xanderView/file/readers/SevenZipReader.java
        symbols:
          - org.delafer.xanderView.file.readers.SevenZipReader.read
          - org.delafer.xanderView.file.readers.SevenZipReader.getEntryByIdentifier
        note: Opens the archive and wraps each supported image member as ImageZip or ImageDec.
      - path: xanderView/src/main/java/org/delafer/xanderView/file/entry/ImageZip.java
        symbols:
          - org.delafer.xanderView.file.entry.ImageZip.rawData
          - org.delafer.xanderView.file.entry.ImageZip.MyExtractCallback
        note: Extracts one archive member into a ByteBuffer-backed Buf for downstream decoding.
      - path: thirddep-j7/src/main/java/net/sf/sevenzipjbinding/SevenZip.java
        symbols:
          - net.sf.sevenzipjbinding.SevenZip.openInArchive
          - net.sf.sevenzipjbinding.SevenZip.ensureLibraryIsInitialized
        note: The bundled 7-Zip binding performs lazy native initialization before opening archives.

  - id: recursive_scan_and_live_watch
    title: Recursive Scan And Live Watch
    summary: Walks directories, optionally descends into archives, and updates in-memory image sets when files are created or deleted.
    status: confirmed
    owning_module: xanderView
    packages:
      - org.delafer.xanderView.file
      - org.delafer.xanderView.file.readers
      - net.j7.commons.io
    classes:
      - org.delafer.xanderView.file.CommonContainer
      - org.delafer.xanderView.file.CopyService
      - org.delafer.xanderView.file.readers.FileReader
      - net.j7.commons.io.AbstractFileProcessor
    entry_points:
      - org.delafer.xanderView.file.readers.FileReader.read
      - org.delafer.xanderView.file.readers.FileReader.initialize
      - org.delafer.xanderView.file.CommonContainer.initialize
      - org.delafer.xanderView.file.CopyService.initializeInternal
    ui_surfaces:
      - org.delafer.xanderView.gui.MainWindow.open
    collaborators:
      - org.delafer.xanderView.file.entry.ImageFS
      - org.delafer.xanderView.file.readers.SevenZipReader
      - org.delafer.xanderView.gui.config.ApplConfiguration
    configs:
      - recursive
      - filterCount
    resources: []
    native_dependencies: []
    persistence: []
    tests: []
    related_features:
      - archive_browsing
      - sort_navigation_and_selection
      - copy_collect_export
    evidence:
      - path: xanderView/src/main/java/org/delafer/xanderView/file/readers/FileReader.java
        symbols:
          - org.delafer.xanderView.file.readers.FileReader.read
        note: Uses AbstractFileProcessor and optionally opens nested archives when recursive mode is enabled.
      - path: xanderView/src/main/java/org/delafer/xanderView/file/readers/FileReader.java
        symbols:
          - org.delafer.xanderView.file.readers.FileReader.initialize
        note: Registers a WatchService with ExtendedWatchEventModifier.FILE_TREE and forwards create/delete events.
      - path: xanderView/src/main/java/org/delafer/xanderView/file/CommonContainer.java
        symbols:
          - org.delafer.xanderView.file.CommonContainer.initialize
        note: Applies reader events to the sorted image list and current pointer.
      - path: xanderView/src/main/java/org/delafer/xanderView/file/CopyService.java
        symbols:
          - org.delafer.xanderView.file.CopyService.readStructure
          - org.delafer.xanderView.file.CopyService.initializeInternal
        note: Builds and maintains a live index of the current copy target directory.

  - id: image_decode_pipeline
    title: Image Decode Pipeline
    summary: Resolves an image entry to bytes, chooses a decode path by image type, then feeds a BufferedImage into the canvas renderer.
    status: confirmed
    owning_module: xanderView
    packages:
      - org.delafer.xanderView.gui
      - org.delafer.xanderView.file.entry
      - org.delafer.xanderView.interfaces
    classes:
      - org.delafer.xanderView.gui.ImageLoader
      - org.delafer.xanderView.file.entry.ImageAbstract
      - org.delafer.xanderView.file.entry.Buf
      - org.libjpegturbo.turbojpeg.TJDecompressor
    entry_points:
      - org.delafer.xanderView.gui.ImageLoader.loadImage
      - org.delafer.xanderView.file.entry.ImageAbstract.content
      - org.delafer.xanderView.gui.ImageLoader.loadJpegImage
    ui_surfaces:
      - org.delafer.xanderView.gui.MainWindow.open
      - org.delafer.xanderView.gui.MainWindow.bindKeyEvent
    collaborators:
      - org.delafer.xanderView.gui.ImageCanvas
      - org.delafer.xanderView.gui.config.OrientationStore
      - javax.imageio.ImageIO
    configs: []
    resources:
      - thirddep-j7/src/main/resources/META-INF/services/javax.imageio.spi.ImageReaderSpi
      - thirddep-j7/src/main/resources/META-INF/services/javax.imageio.spi.ImageWriterSpi
    native_dependencies:
      - turbojpeg
      - webp-imageio
      - libjxl_jni
    persistence:
      - _zlst.csv
    tests:
      - xanderView/src/test/java/org/delafer/xanderView/tests/TestRead.java
      - xanderView/src/test/java/org/delafer/xanderView/scale/test/TestOpenCvResizer.java
    related_features:
      - encrypted_image_flow
      - aim_container_decode
      - native_codec_and_library_loading
      - resize_orientation_gamma
    evidence:
      - path: xanderView/src/main/java/org/delafer/xanderView/gui/ImageLoader.java
        symbols:
          - org.delafer.xanderView.gui.ImageLoader.loadImage
          - org.delafer.xanderView.gui.ImageLoader.loadJpegImage
        note: Switches on ImageType and uses TurboJPEG for JPEG with an ImageIO fallback for other formats.
      - path: xanderView/src/main/java/org/delafer/xanderView/file/entry/ImageAbstract.java
        symbols:
          - org.delafer.xanderView.file.entry.ImageAbstract.content
          - org.delafer.xanderView.file.entry.ImageAbstract.getTypeByExt
        note: Normalizes image type dispatch and records the last opened entry before reading bytes.
      - path: xanderView/src/main/java/org/delafer/xanderView/interfaces/IImageEntry.java
        symbols:
          - org.delafer.xanderView.interfaces.IImageEntry.types
        note: Confirms supported extensions including jpg, png, avif, webp, jxl, aim, cry, and xav.
      - path: thirddep-j7/src/main/resources/META-INF/services/javax.imageio.spi.ImageReaderSpi
        symbols:
          - vavi.imageio.avif.AvifImageReaderSpi
          - com.luciad.imageio.webp.WebPImageReaderSpi
          - vavi.imageio.jpegxl.jni.JpegXLImageReaderSpi
        note: Registers additional ImageIO codecs consumed by the default ImageIO path.

  - id: encrypted_image_flow
    title: Encrypted Image Flow
    summary: Detects `.cry` entries, derives an AES key from the configured keyfile, decrypts data on demand, and can re-export images as encrypted copies.
    status: confirmed
    owning_module: xanderView
    packages:
      - org.delafer.xanderView.file.entry
      - org.delafer.xanderView.gui.config
    classes:
      - org.delafer.xanderView.file.entry.ImageDec
      - org.delafer.xanderView.file.entry.ImageEnc
      - org.delafer.xanderView.file.entry.Encryptor
      - org.delafer.xanderView.gui.config.ApplConfiguration
    entry_points:
      - org.delafer.xanderView.file.entry.ImageFS.getInstance
      - org.delafer.xanderView.file.entry.ImageZip.getInstance
      - org.delafer.xanderView.file.entry.Encryptor.decrypt
      - org.delafer.xanderView.file.entry.ImageEnc.getEncrypted
    ui_surfaces:
      - org.delafer.xanderView.gui.MainWindow.bindKeyEvent
    collaborators:
      - org.delafer.xanderView.file.CopyService
      - org.delafer.xanderView.hash.Hasher
      - org.delafer.xanderView.file.entry.CipherKey
    configs:
      - cry.keyfile
    resources: []
    native_dependencies: []
    persistence:
      - xander.properties
    tests:
      - xanderView/src/test/java/org/delafer/xanderView/tests/EncryptorOld.java
    related_features:
      - image_decode_pipeline
      - copy_collect_export
      - config_and_state_persistence
    evidence:
      - path: xanderView/src/main/java/org/delafer/xanderView/file/entry/ImageFS.java
        symbols:
          - org.delafer.xanderView.file.entry.ImageFS.getInstance
        note: Wraps ENCRYPTED filesystem entries in ImageDec.
      - path: xanderView/src/main/java/org/delafer/xanderView/file/entry/ImageZip.java
        symbols:
          - org.delafer.xanderView.file.entry.ImageZip.getInstance
        note: Wraps ENCRYPTED archive members in ImageDec as well.
      - path: xanderView/src/main/java/org/delafer/xanderView/file/entry/Encryptor.java
        symbols:
          - org.delafer.xanderView.file.entry.Encryptor.getCipher
          - org.delafer.xanderView.file.entry.Encryptor.decrypt
          - org.delafer.xanderView.file.entry.Encryptor.encrypt
        note: Uses AES_128/ECB/NoPadding with a key derived from ApplConfiguration.pwd().
      - path: xanderView/src/main/java/org/delafer/xanderView/gui/MainWindow.java
        symbols:
          - org.delafer.xanderView.gui.MainWindow.bindKeyEvent
        note: F1 copies encrypted output and F3 copies decrypted output through CopyService.

