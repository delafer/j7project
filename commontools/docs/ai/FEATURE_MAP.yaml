modules:
  - name: commons-j7
    role: Shared utility and native-loader module used by the active reactor.
    depends_on: []
    key_packages:
      - net.j7.commons.io
      - net.j7.commons.jni
      - net.j7.commons.streams
      - net.j7.commons.types
    key_entry_points:
      - net.j7.commons.jni.LibraryLoader.loadLibrary
    notes: Java 16 jar. Provides reusable filesystem and path helpers, buffer utilities, hash and bit-range helpers, and the native library extraction path used by xanderView and thirddep-j7.
  - name: thirddep-j7
    role: Vendored dependency wrapper jar containing SWT sources, archive bindings, codec integrations, and native wrappers.
    depends_on:
      - commons-j7
    key_packages:
      - net.sf.sevenzipjbinding
      - org.libjpegturbo.turbojpeg
      - com.luciad.imageio.webp
      - vavi.imageio.avif
      - vavi.imageio.jpegxl.jni
      - org.eclipse.swt.awt
    key_entry_points:
      - net.sf.sevenzipjbinding.SevenZip.ensureLibraryIsInitialized
      - org.libjpegturbo.turbojpeg.TJLoader.load
      - com.luciad.imageio.webp.WebP.loadNativeLibrary
    notes: Java 16 jar. Packages additional ImageIO readers and writers plus Windows-native DLLs under src/main/resources.
  - name: xanderView
    role: Main Java 21 desktop image viewer application.
    depends_on:
      - commons-j7
      - thirddep-j7
    key_packages:
      - org.delafer.xanderView.gui
      - org.delafer.xanderView.file
      - org.delafer.xanderView.file.entry
      - org.delafer.xanderView.file.readers
      - org.delafer.xanderView.scale
    key_entry_points:
      - org.delafer.xanderView.gui.MainEntryPoint.main
      - org.delafer.xanderView.gui.MainWindow.open
    notes: Shaded jar main class is org.delafer.xanderView.gui.MainEntryPoint. Owns viewer UI, container navigation, decode and export workflows, config, and view-state persistence.
  - name: filecleaner-j7
    role: Legacy CLI and utility module outside the active reactor.
    depends_on:
      - commons-j7
    key_packages: []
    key_entry_points: []
    notes: Present in the repository tree but commented out in the root reactor.
  - name: security
    role: Standalone crypto playground outside the active reactor.
    depends_on:
      - commons-j7
    key_packages:
      - (default)
    key_entry_points: []
    notes: Not listed in the root reactor; useful only as exploratory crypto code.
  - name: xmlbench
    role: Legacy SWT and XML compression workbench outside the active reactor.
    depends_on:
      - commons-j7
      - thirddep-j7
    key_packages:
      - org.delafer.xmlbench
      - org.delafer.xmlbench.compressors
      - org.delafer.xmlbench.wizard
    key_entry_points:
      - org.delafer.xmlbench.MainWindow
    notes: Not part of the root reactor. Shares the repo but does not participate in xanderView startup.
  - name: zip5j
    role: Legacy zip utility playground outside the active reactor.
    depends_on:
      - commons-j7
      - thirddep-j7
    key_packages:
      - org.delafer.zip5j
    key_entry_points:
      - org.delafer.zip5j.MainWindow
    notes: Not part of the root reactor. Kept in the tree as a side module.

startup:
  entry_class: org.delafer.xanderView.gui.MainEntryPoint
  sequence:
    - step: jar_and_script_launch
      path: xanderView/pom.xml
      symbol: org.apache.maven.plugins.shade.resource.ManifestResourceTransformer.mainClass
      note: The shaded jar manifest points to org.delafer.xanderView.gui.MainEntryPoint; start17.bat and start23.bat run that jar.
    - step: main_properties_and_shutdown
      path: xanderView/src/main/java/org/delafer/xanderView/gui/MainEntryPoint.java
      symbol: org.delafer.xanderView.gui.MainEntryPoint.main
      note: Disables several Java2D HiDPI flags, registers the shutdown hook, disables Metrics, and starts initialization.
    - step: preload_resources
      path: xanderView/src/main/java/org/delafer/xanderView/gui/MainEntryPoint.java
      symbol: org.delafer.xanderView.gui.MainEntryPoint.initializeApp
      note: Loads image resources, orientation state, and initializes CopyService.
    - step: copy_target_index_boot
      path: xanderView/src/main/java/org/delafer/xanderView/file/CopyService.java
      symbol: org.delafer.xanderView.file.CopyService.instance
      note: Builds a multiton keyed by the current copy directory and starts an asynchronous target scan.
    - step: main_window_creation
      path: xanderView/src/main/java/org/delafer/xanderView/gui/MainEntryPoint.java
      symbol: org.delafer.xanderView.gui.MainEntryPoint.main
      note: Constructs MainWindow and forwards the first CLI argument as the path to open.
    - step: container_resolution
      path: xanderView/src/main/java/org/delafer/xanderView/gui/MainWindow.java
      symbol: org.delafer.xanderView.gui.MainWindow.open
      note: Creates CommonContainerExt for the requested path, which in turn selects FileReader or SevenZipReader.
    - step: container_scan
      path: xanderView/src/main/java/org/delafer/xanderView/file/CommonContainer.java
      symbol: org.delafer.xanderView.file.CommonContainer.initialize
      note: Registers content watchers, scans initial entries, sorts them, and restores the last-entry pointer when possible.
    - step: swt_bootstrap
      path: xanderView/src/main/java/org/delafer/xanderView/gui/MainWindow.java
      symbol: org.delafer.xanderView.gui.MainWindow.intitialize
      note: Creates Display, records display size, and installs a global SWT KeyDown filter.
    - step: shell_and_canvas_setup
      path: xanderView/src/main/java/org/delafer/xanderView/gui/MainWindow.java
      symbol: org.delafer.xanderView.gui.MainWindow.show
      note: Creates MultiShell, menu bar, icons, embedded SWT and AWT canvas, and opens the active shell.
    - step: first_image_dispatch
      path: xanderView/src/main/java/org/delafer/xanderView/gui/MainWindow.java
      symbol: org.delafer.xanderView.gui.MainWindow.show
      note: If a current image exists, the first load is scheduled onto the AWT EventQueue.
    - step: decode_and_render
      path: xanderView/src/main/java/org/delafer/xanderView/gui/ImageLoader.java
      symbol: org.delafer.xanderView.gui.ImageLoader.loadImage
      note: Reads bytes, chooses a codec path, applies copy-state and CRC-backed orientation data, and paints via ImageCanvas.
    - step: event_loop_and_shutdown
      path: xanderView/src/main/java/org/delafer/xanderView/general/Shutdown.java
      symbol: org.delafer.xanderView.general.Shutdown.addHook
      note: The SWT loop runs until the window closes; shutdown then persists xander.properties, imagedata.bin, and buffered history.

open_questions:
  - MainWindow.open dereferences path without a null check, but MainEntryPoint.main passes null when no CLI argument exists; confirm whether production always launches with a path.
  - The filter package exists, but no confirmed runtime call path was found and FilterParser.parse currently recurses into itself; determine whether the subsystem is abandoned.
  - ImageType.XAV is treated as a virtual directory in HelperFS, but no concrete XAV reader or decoder implementation was found.
  - commons-j7/src/main/resources/libs.properties points at C:/Program Files/xview; confirm the intended native deployment story for production jars.
